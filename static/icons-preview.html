<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轻排班图标体系 v1 · 总览</title>
<style>
  :root {
    --bg: #F7F3EA; --surface: #FFFDF8; --primary: #78664F; --primary-container: #E9DDC8;
    --on-surface: #292720; --on-surface-variant: #68645C; --outline: #DED7CA;
    --success: #526B55; --warning: #94651E; --error: #A1463D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 44px; background: var(--bg); font-family: "Microsoft YaHei", sans-serif; color: var(--on-surface); }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--on-surface-variant); font-size: 13px; margin-bottom: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; max-width: 1080px; }
  .cell {
    width: 168px; background: var(--surface); border: 1px solid var(--outline);
    border-radius: 14px; padding: 16px 10px 12px; text-align: center;
  }
  .cell svg { width: 46px; height: 46px; }
  .cell .on-primary svg { stroke: #FFFDF8; }
  .cell .name { font-size: 13px; margin-top: 10px; color: var(--on-surface-variant); }
  .row { display: flex; gap: 14px; margin-top: 24px; align-items: stretch; flex-wrap: wrap; }
  .brand-box, .states-box {
    background: var(--surface); border: 1px solid var(--outline); border-radius: 14px; padding: 18px 22px;
  }
  .brand-box svg.favicon { width: 84px; height: 84px; }
  .brand-side { display: flex; align-items: center; gap: 12px; margin-top: 14px;
    background: var(--surface); border: 1px solid var(--outline); border-radius: 999px; padding: 8px 18px 8px 8px; width: fit-content; }
  .brand-side .mark { width: 40px; height: 40px; border-radius: 14px; background: var(--primary); display: grid; place-items: center; }
  .brand-side .mark svg { width: 24px; height: 24px; stroke: #FFFDF8; }
  .brand-side .name { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .states { display: flex; gap: 10px; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; }
  .chip svg { width: 15px; height: 15px; }
  .chip-error { background: #F4DCD8; color: var(--error); }
  .chip-warning { background: #F3E4C8; color: var(--warning); }
  .chip-success { background: #DCE7DA; color: var(--success); }
  .swatches { display: flex; gap: 8px; margin-top: 14px; }
  .sw { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--outline); }
</style>
</head>
<body>
<h1>轻排班 · 原创图标体系 v1</h1>
<div class="sub">24×24 线性 · stroke 2 圆角端点 · 实心圆角小块 = “班次/数据”语义 · 元素取自站点本体（日历、班次块、圆角瓦片、滑杆）</div>
<div class="grid" id="grid"></div>

<div class="row">
  <div class="brand-box">
    <div style="font-size:13px; color:var(--on-surface-variant); margin-bottom:10px;">品牌站点图标 favicon.svg</div>
    <svg class="favicon" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#78664F"/><rect x="14" y="16" width="36" height="34" rx="7" fill="none" stroke="#FFFDF8" stroke-width="4"/><path d="M22 11v9M42 11v9" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round"/><path d="M14 26.5h36" stroke="#FFFDF8" stroke-width="4"/><rect x="20" y="33" width="11" height="6.5" rx="3.25" fill="#E9DDC8"/><rect x="35" y="33" width="9" height="6.5" rx="3.25" fill="none" stroke="#FFFDF8" stroke-width="3"/></svg>
    <div class="brand-side">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4"/><path d="M3.5 10h17"/><rect x="6.5" y="13" width="5" height="2.6" rx="1.3" fill="currentColor" stroke="none"/><rect x="13.8" y="13" width="3.7" height="2.6" rx="1.3"/></svg></span>
      <span class="name">轻排班</span>
    </div>
  </div>
  <div class="states-box">
    <div style="font-size:13px; color:var(--on-surface-variant); margin-bottom:10px;">状态图标（图标 + 文字，不单靠颜色）</div>
    <div class="states">
      <span class="chip chip-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>3 项错误</span>
      <span class="chip chip-warning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.4 4.2 3.2 17.4a1.9 1.9 0 0 0 1.7 2.8h14.2a1.9 1.9 0 0 0 1.7-2.8L13.6 4.2a1.9 1.9 0 0 0-3.2 0z"/><path d="M12 9.2v4"/><circle cx="12" cy="16.4" r="0.7" fill="currentColor" stroke="none"/></svg>8 项提示</span>
      <span class="chip chip-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>无冲突</span>
    </div>
    <div style="font-size:13px; color:var(--on-surface-variant); margin:16px 0 10px;">主题色板（图标继承 currentColor）</div>
    <div class="swatches">
      <div class="sw" style="background:#78664F" title="主色"></div>
      <div class="sw" style="background:#E9DDC8" title="主色容器"></div>
      <div class="sw" style="background:#6D7765" title="次要"></div>
      <div class="sw" style="background:#B47B55" title="强调"></div>
      <div class="sw" style="background:#526B55" title="成功"></div>
      <div class="sw" style="background:#94651E" title="警告"></div>
      <div class="sw" style="background:#A1463D" title="错误"></div>
    </div>
  </div>
</div>

<script>
  const ICONS = {"dashboard": "<rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"2\" fill=\"currentColor\" stroke=\"none\"/>", "calendar": "<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"3\"/><path d=\"M8 3v4M16 3v4\"/><path d=\"M3.5 10h17\"/><rect x=\"6.5\" y=\"13\" width=\"5\" height=\"2.6\" rx=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><rect x=\"13.8\" y=\"13\" width=\"3.7\" height=\"2.6\" rx=\"1.3\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M3.5 20c0-3.1 2.4-5.2 5.5-5.2s5.5 2.1 5.5 5.2\"/><path d=\"M15.5 4.9a3.5 3.5 0 0 1 0 6.2\"/><path d=\"M17.5 15.2c2 .7 3.3 2.4 3.3 4.8\"/>", "briefcase": "<rect x=\"3.5\" y=\"7.5\" width=\"17\" height=\"12.5\" rx=\"3\"/><path d=\"M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5\"/><rect x=\"7\" y=\"12.2\" width=\"10\" height=\"3\" rx=\"1.5\" fill=\"currentColor\" stroke=\"none\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 7.5V12l3.2 1.8\"/>", "chart": "<path d=\"M4 4v16h16\"/><rect x=\"7.5\" y=\"12.5\" width=\"3.2\" height=\"7.5\" rx=\"1.6\" fill=\"currentColor\" stroke=\"none\"/><rect x=\"12.4\" y=\"8\" width=\"3.2\" height=\"12\" rx=\"1.6\" fill=\"currentColor\" stroke=\"none\"/><rect x=\"17.3\" y=\"10.5\" width=\"3.2\" height=\"9.5\" rx=\"1.6\" fill=\"currentColor\" stroke=\"none\"/>", "sliders": "<path d=\"M4 7h6.2M14.8 7H20\"/><circle cx=\"12.5\" cy=\"7\" r=\"2.3\"/><path d=\"M4 17h4.2M12.8 17H20\"/><circle cx=\"10.5\" cy=\"17\" r=\"2.3\"/>", "download": "<path d=\"M4.5 15.5V18a2.5 2.5 0 0 0 2.5 2.5h10A2.5 2.5 0 0 0 19.5 18v-2.5\"/><path d=\"M12 4v10.5M7.8 10.7 12 15l4.2-4.3\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "user-plus": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M3.5 20c0-3.1 2.4-5.2 5.5-5.2 1.6 0 3 .6 4 1.6\"/><path d=\"M18.5 10.5v6M15.5 13.5h6\"/>", "edit": "<path d=\"M4.5 19.5h3.2L19 8.2a2.26 2.26 0 0 0-3.2-3.2L4.5 16.3z\"/><path d=\"m13.6 7.2 3.2 3.2\"/>", "trash": "<path d=\"M4.5 6.8h15\"/><path d=\"M9.3 6.5V5.2A1.7 1.7 0 0 1 11 3.5h2a1.7 1.7 0 0 1 1.7 1.7v1.3\"/><path d=\"m6.3 6.8.7 12a2 2 0 0 0 2 1.9h6a2 2 0 0 0 2-1.9l.7-12\"/><path d=\"M10 10.5v6M14 10.5v6\"/>", "alert": "<path d=\"M10.4 4.2 3.2 17.4a1.9 1.9 0 0 0 1.7 2.8h14.2a1.9 1.9 0 0 0 1.7-2.8L13.6 4.2a1.9 1.9 0 0 0-3.2 0z\"/><path d=\"M12 9.2v4\"/><circle cx=\"12\" cy=\"16.4\" r=\"0.7\" fill=\"currentColor\" stroke=\"none\"/>", "check-circle": "<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"m8.3 12.3 2.6 2.6 4.9-5.3\"/>", "x-circle": "<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6\"/>", "info": "<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 11v5\"/><circle cx=\"12\" cy=\"7.8\" r=\"0.7\" fill=\"currentColor\" stroke=\"none\"/>", "x": "<path d=\"M6 6l12 12M18 6 6 18\"/>", "chevron-left": "<polyline points=\"14.5 5.5 8 12l6.5 6.5\"/>", "chevron-right": "<polyline points=\"9.5 5.5 16 12l-6.5 6.5\"/>", "save": "<path d=\"M19.5 9.2V18a1.8 1.8 0 0 1-1.8 1.8H6.3A1.8 1.8 0 0 1 4.5 18V6.3a1.8 1.8 0 0 1 1.8-1.8h8.7z\"/><path d=\"M8 4.5v4.2h6.5V4.5\"/><path d=\"M8 19.8v-5.6h8v5.6\"/>", "database": "<ellipse cx=\"12\" cy=\"5.8\" rx=\"7.5\" ry=\"2.8\"/><path d=\"M4.5 5.8v12.4c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8V5.8\"/><path d=\"M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8\"/>", "refresh": "<path d=\"M20 12a8 8 0 1 1-2.4-5.7\"/><path d=\"M20 4.5V9h-4.5\"/>"};
  const LABELS = { dashboard: "概览", calendar: "排班", users: "员工", briefcase: "班次模板",
    clock: "班次时段", chart: "工时统计", sliders: "设置", download: "导出", plus: "新增",
    "user-plus": "新增员工", edit: "编辑", trash: "删除", alert: "警告", "check-circle": "成功",
    "x-circle": "错误", info: "信息", x: "关闭", "chevron-left": "上一页", "chevron-right": "下一页",
    save: "保存", database: "备份", refresh: "重置" };
  document.getElementById("grid").innerHTML = Object.entries(ICONS).map(([name, markup]) => `
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">${markup}</svg>
      <div class="name">${name}<br>${LABELS[name] ?? ""}</div>
    </div>`).join("");
</script>
</body>
</html>
